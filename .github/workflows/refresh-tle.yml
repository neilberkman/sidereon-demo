name: refresh-tle
on:
  schedule:
    # Two passes a day: a CelesTrak outage at the first slot costs hours of
    # staleness instead of a full day. Still well under their per-group cadence
    # guidance.
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch element sets from CelesTrak (one polite pass per run)
        id: fetch
        run: |
          set -euo pipefail
          refreshed=()
          failed=()
          for group in gps-ops galileo glo-ops beidou; do
            out="public/data/${group}.tle"
            # A failed group keeps its previous file and the loop moves on; one
            # upstream timeout must not leave every other constellation stale.
            if curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 20 --fail --silent --show-error \
                 --connect-timeout 30 --max-time 120 -A "sidereon.dev daily refresh (github action)" \
                 "https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=tle" -o "${out}.new"; then
              # sanity: at least 3 records (3 lines each)
              lines=$(wc -l < "${out}.new")
              if [ "$lines" -lt 9 ]; then
                echo "${group}: too few lines ($lines), keeping previous"
                rm -f "${out}.new"; failed+=("$group")
              else
                mv "${out}.new" "${out}"; refreshed+=("$group")
              fi
            else
              echo "${group}: fetch failed, keeping previous"
              rm -f "${out}.new"; failed+=("$group")
            fi
            sleep 15
          done
          # refreshedAt describes the oldest file the site serves, so it only
          # advances when every group refreshed in this run.
          if [ "${#failed[@]}" -eq 0 ]; then
            printf '{"refreshedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/data/tle-refresh.json
          fi
          echo "refreshed: ${refreshed[*]:-none}"
          echo "failed: ${failed[*]:-none}"
          echo "failed=${failed[*]:-}" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        run: |
          git config user.name "tle-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/*.tle public/data/tle-refresh.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: daily element-set refresh"
          git push
      - name: Upload data files to the CDN and purge
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,glob
          k=os.environ["BUNNY_API_KEY"]
          sz=json.load(urllib.request.urlopen(urllib.request.Request("https://api.bunny.net/storagezone/1616378",headers={"AccessKey":k,"Accept":"application/json"})))
          pw=sz["Password"]; name=sz["Name"]
          for f in glob.glob("public/data/*.tle") + ["public/data/tle-refresh.json"]:
              rel="data/"+os.path.basename(f); data=open(f,"rb").read()
              urllib.request.urlopen(urllib.request.Request(f"https://ny.storage.bunnycdn.com/{name}/{rel}",data=data,method="PUT",headers={"AccessKey":pw,"Content-Type":"application/octet-stream"}),timeout=120)
              got=urllib.request.urlopen(urllib.request.Request(f"https://ny.storage.bunnycdn.com/{name}/{rel}",headers={"AccessKey":pw}),timeout=120).read()
              assert len(got)==len(data), rel
              print("uploaded",rel,len(data))
          urllib.request.urlopen(urllib.request.Request("https://api.bunny.net/pullzone/6071487/purgeCache",method="POST",headers={"AccessKey":k,"Content-Length":"0"}))
          print("purge OK")
          PY
      - name: Fail the run if any group kept stale data
        if: always() && steps.fetch.outputs.failed != ''
        run: |
          echo "::error::element sets kept stale for: ${{ steps.fetch.outputs.failed }}"
          exit 1
