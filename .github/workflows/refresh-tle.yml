name: refresh-tle
on:
  schedule:
    # Two passes a day: a failure at the first slot costs hours of staleness
    # instead of a full day. Still well under CelesTrak's per-group cadence
    # guidance.
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch element sets (CelesTrak, Space-Track fallback per group)
        id: fetch
        env:
          SPACETRACK_IDENTITY: ${{ secrets.SPACETRACK_IDENTITY }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
        run: scripts/refresh-tle.sh
      - name: Commit if changed
        run: |
          git config user.name "tle-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/*.tle public/data/tle-refresh.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: daily element-set refresh"
          git push
      - name: Upload data files to the CDN and purge
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,glob
          k=os.environ["BUNNY_API_KEY"]
          sz=json.load(urllib.request.urlopen(urllib.request.Request("https://api.bunny.net/storagezone/1616378",headers={"AccessKey":k,"Accept":"application/json"})))
          pw=sz["Password"]; name=sz["Name"]
          for f in glob.glob("public/data/*.tle") + ["public/data/tle-refresh.json"]:
              rel="data/"+os.path.basename(f); data=open(f,"rb").read()
              urllib.request.urlopen(urllib.request.Request(f"https://ny.storage.bunnycdn.com/{name}/{rel}",data=data,method="PUT",headers={"AccessKey":pw,"Content-Type":"application/octet-stream"}),timeout=120)
              got=urllib.request.urlopen(urllib.request.Request(f"https://ny.storage.bunnycdn.com/{name}/{rel}",headers={"AccessKey":pw}),timeout=120).read()
              assert len(got)==len(data), rel
              print("uploaded",rel,len(data))
          urllib.request.urlopen(urllib.request.Request("https://api.bunny.net/pullzone/6071487/purgeCache",method="POST",headers={"AccessKey":k,"Content-Length":"0"}))
          print("purge OK")
          PY
      # A fetch failure alone is not worth failing on: CelesTrak refuses shared
      # CI egress ranges and has its own outages, and the previous element sets
      # stay in place. The run fails once those sets are actually too old to
      # serve, which is the condition a human needs to act on.
      - name: Fail the run if the served element sets are stale
        if: always() && steps.fetch.outputs.alarm == 'true'
        run: |
          echo "::error::element sets are ${{ steps.fetch.outputs.stale_hours }}h old; could not refresh: ${{ steps.fetch.outputs.failed }}"
          exit 1
