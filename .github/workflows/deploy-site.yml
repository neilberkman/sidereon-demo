name: deploy-site

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/*.tle"
      - "public/data/tle-refresh.json"
      - ".github/workflows/refresh-tle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check
        run: |
          npm run typecheck
          npm test
      - name: Build
        run: npm run build
      - name: Install browser for functional checks
        run: npx playwright install --with-deps chromium
      - name: Verify bundled browser WASM flows
        env:
          BASE: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          npm run preview -- --host 127.0.0.1 > browser-evidence/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BASE" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat browser-evidence/preview.log
            exit 1
          fi

          timeout 120s node scripts/verify-solve.mjs 2>&1 | tee browser-evidence/verify-solve.log
          timeout 120s node scripts/verify-pair.mjs 2>&1 | tee browser-evidence/verify-pair.log
          timeout 180s node scripts/verify-rtk.mjs 2>&1 | tee browser-evidence/verify-rtk.log
          mv screenshots browser-evidence/local-screenshots
      - name: Check Go module discovery page
        run: |
          grep -Fq '<meta name="go-import" content="sidereon.dev/go/v3 git https://github.com/neilberkman/sidereon-go">' dist/go/v3/index.html
      - name: Upload to BunnyCDN and purge
        if: github.event_name != 'pull_request'
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import mimetypes
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api_key = os.environ["BUNNY_API_KEY"]
          zone = json.load(urlopen(Request(
              "https://api.bunny.net/storagezone/1616378",
              headers={"AccessKey": api_key, "Accept": "application/json"},
          )))
          password = zone["Password"]
          zone_name = zone["Name"]

          files = sorted(path for path in Path("dist").rglob("*") if path.is_file())
          if not files:
              raise RuntimeError("production build is empty")

          for path in files:
              relative = path.relative_to("dist").as_posix()
              content_type = mimetypes.guess_type(relative)[0] or "application/octet-stream"
              data = path.read_bytes()
              request = Request(
                  f"https://ny.storage.bunnycdn.com/{zone_name}/{quote(relative, safe='/')}",
                  data=data,
                  method="PUT",
                  headers={
                      "AccessKey": password,
                      "Content-Type": content_type,
                  },
              )
              with urlopen(request, timeout=120) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(f"upload failed for {relative}: HTTP {response.status}")
              print(f"uploaded {relative} ({len(data)} bytes)")

          urlopen(Request(
              "https://api.bunny.net/pullzone/6071487/purgeCache",
              data=b"",
              method="POST",
              headers={"AccessKey": api_key, "Content-Length": "0"},
          ), timeout=120).read()
          print(f"purged CDN after uploading {len(files)} files")
          PY
      - name: Verify live entry point
        if: github.event_name != 'pull_request'
        run: |
          expected=$(sha256sum dist/index.html | cut -d' ' -f1)
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error \
              "https://sidereon.dev/?deploy=${GITHUB_SHA}-${attempt}" \
              -o /tmp/live-index.html
            actual=$(sha256sum /tmp/live-index.html | cut -d' ' -f1)
            if [ "$actual" = "$expected" ]; then
              echo "live index verified: $actual"
              exit 0
            fi
            echo "attempt $attempt: waiting for CDN propagation"
            sleep 5
          done
          echo "live index does not match the deployed build" >&2
          exit 1
      - name: Verify live Go module discovery
        if: github.event_name != 'pull_request'
        run: |
          expected='<meta name="go-import" content="sidereon.dev/go/v3 git https://github.com/neilberkman/sidereon-go">'
          grep -Fq "$expected" dist/go/v3/index.html
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              -D /tmp/live-go-import-headers.txt \
              "https://sidereon.dev/go/v3?go-get=1&deploy=${GITHUB_SHA}-${attempt}" \
              -o /tmp/live-go-import.html; then
              if grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' /tmp/live-go-import-headers.txt \
                && grep -Fq "$expected" /tmp/live-go-import.html; then
                echo "live Go module discovery metadata verified"
                exit 0
              fi
            fi
            echo "attempt $attempt: waiting for Go module route propagation"
            sleep 5
          done
          echo "live Go module discovery metadata is missing or malformed" >&2
          exit 1
      - name: Verify live browser WASM flows
        if: github.event_name != 'pull_request'
        env:
          BASE: https://sidereon.dev
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          trap 'if [ -d screenshots ]; then rm -rf browser-evidence/live-screenshots; mv screenshots browser-evidence/live-screenshots; fi' EXIT
          timeout 120s node scripts/verify-solve.mjs 2>&1 | tee browser-evidence/live-verify-solve.log
          timeout 120s node scripts/verify-pair.mjs 2>&1 | tee browser-evidence/live-verify-pair.log
          timeout 180s node scripts/verify-rtk.mjs 2>&1 | tee browser-evidence/live-verify-rtk.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-functional-evidence-${{ github.sha }}
          path: |
            browser-evidence/
            screenshots/
          if-no-files-found: error
          retention-days: 7
